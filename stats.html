<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPOTT — Statistikk</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD0nuUQPb7R5O5fHBZM4IDN2DzrIVGgNwU",
    authDomain: "spott-tuapw2.firebaseapp.com",
    projectId: "spott-tuapw2",
    storageBucket: "spott-tuapw2.firebasestorage.app",
    messagingSenderId: "95149029981",
    appId: "1:95149029981:web:1d51147f95e12d33226bb4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window.doLogin = async function(email, password){
    try {
      await signInWithEmailAndPassword(auth, email, password);
      return { ok: true };
    } catch(err){
      return { ok: false, error: err.code };
    }
  };

  window.doLogout = async function(){
    await signOut(auth);
    location.reload();
  };

  window.loadData = async function(){
    const surveyQ = query(collection(db, "surveyResponses"), orderBy("submittedAt", "desc"));
    const contactQ = query(collection(db, "contactRequests"), orderBy("submittedAt", "desc"));
    const [surveys, contacts] = await Promise.all([getDocs(surveyQ), getDocs(contactQ)]);
    return {
      surveys: surveys.docs.map(d => ({id:d.id, ...d.data()})),
      contacts: contacts.docs.map(d => ({id:d.id, ...d.data()}))
    };
  };

  onAuthStateChanged(auth, (user) => {
    if(user){
      document.getElementById("login-view").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      document.getElementById("user-email").textContent = user.email;
      window.renderDashboard();
    } else {
      document.getElementById("login-view").style.display = "flex";
      document.getElementById("dashboard").style.display = "none";
    }
  });
</script>
<style>
  :root{
    --bg:#0c0c0b; --bg-card:#141413; --border:#222221;
    --orange:#E8531A; --text:#f0ede8; --muted:#7a7871; --muted-2:#555350;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Barlow Condensed', sans-serif; min-height:100vh;
  }
  p, .body-text, td, th, input, select{font-family:system-ui,-apple-system,sans-serif;}

  /* Login */
  #login-view{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-card{
    background:var(--bg-card); border:1px solid var(--border); border-radius:16px;
    padding:40px 36px; max-width:400px; width:100%;
  }
  .login-logo{
    font-size:28px; font-weight:800; letter-spacing:3px; text-align:center;
    margin-bottom:6px; display:flex; align-items:center; justify-content:center; gap:0.02em;
  }
  .login-sub{font-size:13px; color:var(--muted); text-align:center; margin-bottom:28px; letter-spacing:2px; text-transform:uppercase;}
  .logo-radar{width:0.62em; height:0.62em; overflow:visible; color:var(--orange);}
  .logo-radar-sweep{transform-box:view-box; transform-origin:12px 12px; animation:spin 4s linear infinite;}
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .login-input{
    width:100%; font-size:15px; color:var(--text);
    background:#0c0c0b; border:1px solid var(--border); border-radius:9px;
    padding:14px 16px; margin-bottom:10px;
  }
  .login-input:focus{outline:2px solid var(--orange); outline-offset:1px;}
  .login-btn{
    width:100%; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:16px;
    letter-spacing:1px; text-transform:uppercase;
    background:var(--orange); color:#fff; border:none; border-radius:9px;
    padding:14px; cursor:pointer; margin-top:8px;
  }
  .login-btn:disabled{background:#1c1c1a; color:var(--muted-2);}
  .login-error{color:#ff6b4a; font-size:13px; margin-top:12px; text-align:center;}

  /* Dashboard */
  #dashboard{display:none;}
  nav{
    display:flex; justify-content:space-between; align-items:center;
    padding:20px 6vw; border-bottom:1px solid var(--border);
  }
  .nav-logo{
    font-size:22px; font-weight:800; letter-spacing:3px;
    display:inline-flex; align-items:center; gap:0.02em;
    color:var(--text); text-decoration:none;
  }
  .nav-right{display:flex; align-items:center; gap:16px;}
  .user-badge{font-size:13px; color:var(--muted); font-family:system-ui;}
  .logout-btn{
    background:transparent; color:var(--muted); border:1px solid var(--border);
    border-radius:7px; padding:8px 14px; font-size:12px; cursor:pointer;
    font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  }
  .logout-btn:hover{color:var(--text); border-color:var(--muted-2);}

  main{padding:40px 6vw 80px; max-width:1200px; margin:0 auto;}

  h1{font-size:36px; font-weight:800; margin-bottom:6px; letter-spacing:-0.5px;}
  .subtitle{color:var(--muted); font-family:system-ui; margin-bottom:36px;}

  .kpi-row{
    display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:40px;
  }
  .kpi{
    background:var(--bg-card); border:1px solid var(--border); border-radius:14px;
    padding:24px 22px;
  }
  .kpi-label{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); font-weight:700;}
  .kpi-value{font-size:44px; font-weight:800; color:var(--text); margin-top:8px; line-height:1;}
  .kpi-value span{color:var(--orange);}
  .kpi-sub{font-size:12px; color:var(--muted-2); margin-top:6px; font-family:system-ui;}

  .section-title{
    font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--orange);
    font-weight:700; margin:40px 0 16px;
  }

  .breakdown-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:16px;
  }
  .breakdown-card{
    background:var(--bg-card); border:1px solid var(--border); border-radius:14px;
    padding:22px 22px;
  }
  .breakdown-card h3{font-size:15px; font-weight:700; margin-bottom:16px; line-height:1.4;}
  .bar-row{display:flex; align-items:center; gap:12px; margin-bottom:8px; font-size:13px; font-family:system-ui;}
  .bar-label{width:170px; color:var(--muted); flex-shrink:0;}
  .bar-track{
    flex:1; height:8px; background:#1c1c1a; border-radius:4px; overflow:hidden;
  }
  .bar-fill{height:100%; background:var(--orange); border-radius:4px; transition:width .3s;}
  .bar-count{width:36px; text-align:right; color:var(--text); font-weight:600; font-size:12px;}

  table{
    width:100%; border-collapse:collapse; background:var(--bg-card);
    border:1px solid var(--border); border-radius:14px; overflow:hidden;
  }
  th{
    text-align:left; padding:14px 16px; font-size:11px; letter-spacing:2px; text-transform:uppercase;
    color:var(--muted); font-weight:700; background:#191917; border-bottom:1px solid var(--border);
  }
  td{
    padding:14px 16px; font-size:14px; border-bottom:1px solid var(--border);
  }
  tr:last-child td{border-bottom:none;}
  tr.expandable{cursor:pointer;}
  tr.expandable:hover td{background:#1a1a18;}
  .row-detail{background:#0f0f0e;}
  .row-detail td{padding:20px 24px; font-size:13.5px; color:var(--muted); line-height:1.7;}
  .row-detail .qline{margin-bottom:10px;}
  .row-detail .qtext{color:var(--muted-2); display:block; margin-bottom:2px; font-size:12px;}
  .row-detail .qans{color:var(--text); font-weight:500;}

  .empty{
    padding:40px; text-align:center; color:var(--muted-2); font-family:system-ui; font-size:14px;
    background:var(--bg-card); border:1px solid var(--border); border-radius:14px;
  }

  .contact-tag{
    display:inline-block; font-size:11px; letter-spacing:1px; text-transform:uppercase;
    padding:3px 8px; border-radius:5px; background:rgba(232,83,26,0.15); color:var(--orange); font-weight:600;
  }

  @media(max-width:760px){
    .kpi-row{grid-template-columns:1fr;}
    .breakdown-grid{grid-template-columns:1fr;}
    .bar-label{width:120px; font-size:12px;}
    table{font-size:12px;}
    th, td{padding:10px 12px;}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-view">
  <div class="login-card">
    <div class="login-logo">SP<svg class="logo-radar" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.3"/>
      <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.5"/>
      <circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.75"/>
      <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
      <line class="logo-radar-sweep" x1="12" y1="12" x2="12" y2="1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>TT</div>
    <div class="login-sub">Statistikk</div>
    <input id="login-email" class="login-input" type="email" placeholder="E-post" autocomplete="username" />
    <input id="login-pw" class="login-input" type="password" placeholder="Passord" autocomplete="current-password" />
    <button id="login-btn" class="login-btn" onclick="handleLogin()">Logg inn</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <nav>
    <a href="#" class="nav-logo" onclick="window.scrollTo({top:0,behavior:'smooth'}); return false;">SP<svg class="logo-radar" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.3"/>
      <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.5"/>
      <circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.75"/>
      <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
      <line class="logo-radar-sweep" x1="12" y1="12" x2="12" y2="1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>TT</a>
    <div class="nav-right">
      <span class="user-badge" id="user-email"></span>
      <button class="logout-btn" onclick="doLogout()">Logg ut</button>
    </div>
  </nav>

  <main>
    <h1>Statistikk</h1>
    <p class="subtitle">Oversikt over undersøkelsessvar og kontakthenvendelser</p>

    <div class="kpi-row">
      <div class="kpi">
        <div class="kpi-label">Totalt antall svar</div>
        <div class="kpi-value" id="kpi-total"><span>0</span></div>
        <div class="kpi-sub">Undersøkelsen totalt</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Siste 7 dager</div>
        <div class="kpi-value" id="kpi-week"><span>0</span></div>
        <div class="kpi-sub">Nye svar denne uken</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Kontakthenvendelser</div>
        <div class="kpi-value" id="kpi-contact"><span>0</span></div>
        <div class="kpi-sub">Fra kontaktskjema</div>
      </div>
    </div>

    <div class="section-title">Fordeling per spørsmål</div>
    <div class="breakdown-grid" id="breakdown-grid"></div>

    <div class="section-title" style="margin-top:48px;">Kontakthenvendelser</div>
    <div id="contact-list"></div>

    <div class="section-title" style="margin-top:48px;">Alle undersøkelsessvar</div>
    <div id="survey-list"></div>
  </main>
</div>

<script>
async function handleLogin(){
  const email = document.getElementById("login-email").value.trim();
  const pw = document.getElementById("login-pw").value;
  const errorEl = document.getElementById("login-error");
  const btn = document.getElementById("login-btn");
  errorEl.textContent = "";
  btn.textContent = "Logger inn...";
  btn.disabled = true;

  const result = await window.doLogin(email, pw);

  if(!result.ok){
    errorEl.textContent = result.error === "auth/invalid-credential"
      ? "Feil e-post eller passord"
      : "Innlogging feilet: " + result.error;
    btn.textContent = "Logg inn";
    btn.disabled = false;
  }
}

document.addEventListener("keydown", (e) => {
  if(e.key === "Enter" && document.getElementById("login-view").style.display !== "none"){
    handleLogin();
  }
});

const QUESTION_ORDER = ["q1","q2","q3","q4","q5","q6","q7"];
const QUESTION_LABELS = {
  q1: "Minutter brukt på leting daglig",
  q2: "Tid/energi tapt når utstyr mangler",
  q3: "Utstyrstyper man leter etter",
  q4: "Nytte av sanntidsposisjon",
  q5: "Frekvens app ville blitt brukt",
  q6: "Uenighet om hvem som hadde verktøyet",
  q7: "Yrke/rolle"
};
const OLD_KEY_MAP = {
  minutterLeting: "q1",
  kostnadVedManglendeUtstyr: "q2",
  utstyrstyper: "q3",
  nyttighetSanntid: "q4",
  bruksfrekvensApp: "q5",
  uenighetOmVerktoy: "q6",
  rolle: "q7"
};

function extractAnswers(response){
  // handles both new format (svar: {q1:{sporsmal,svar}, ...}) and old flat format
  const result = {};
  if(response.svar && typeof response.svar === "object"){
    Object.keys(response.svar).forEach(qid => {
      const item = response.svar[qid];
      result[qid] = item && item.svar !== undefined ? item.svar : item;
    });
  } else {
    Object.keys(OLD_KEY_MAP).forEach(oldKey => {
      if(response[oldKey] !== undefined){
        result[OLD_KEY_MAP[oldKey]] = response[oldKey];
      }
    });
  }
  return result;
}

function formatDate(ts){
  if(!ts) return "-";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString("nb-NO", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
}

function countAnswers(surveys, qid){
  const counts = {};
  surveys.forEach(s => {
    const answers = extractAnswers(s);
    const val = answers[qid];
    if(val === undefined || val === null) return;
    if(Array.isArray(val)){
      val.forEach(v => counts[v] = (counts[v]||0) + 1);
    } else {
      counts[val] = (counts[val]||0) + 1;
    }
  });
  return counts;
}

function renderBreakdown(counts, containerId){
  const entries = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  const max = Math.max(...entries.map(e => e[1]), 1);
  return entries.map(([label, count]) => `
    <div class="bar-row">
      <div class="bar-label" title="${label}">${label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(count/max*100)}%"></div></div>
      <div class="bar-count">${count}</div>
    </div>
  `).join("") || '<div style="color:var(--muted-2); font-family:system-ui; font-size:13px;">Ingen svar ennå</div>';
}

window.renderDashboard = async function(){
  let data;
  try {
    data = await window.loadData();
  } catch(err){
    document.querySelector("main").innerHTML = '<div class="empty">Kunne ikke laste data. Sjekk at brukeren har tilgang i Firestore-reglene.</div>';
    console.error(err);
    return;
  }

  const { surveys, contacts } = data;

  // KPIs
  document.getElementById("kpi-total").innerHTML = `<span>${surveys.length}</span>`;
  const weekAgo = new Date(Date.now() - 7*24*60*60*1000);
  const weekCount = surveys.filter(s => {
    const d = s.submittedAt && s.submittedAt.toDate ? s.submittedAt.toDate() : null;
    return d && d > weekAgo;
  }).length;
  document.getElementById("kpi-week").innerHTML = `<span>${weekCount}</span>`;
  document.getElementById("kpi-contact").innerHTML = `<span>${contacts.length}</span>`;

  // Breakdowns
  const grid = document.getElementById("breakdown-grid");
  grid.innerHTML = QUESTION_ORDER.map(qid => {
    const counts = countAnswers(surveys, qid);
    return `<div class="breakdown-card">
      <h3>${QUESTION_LABELS[qid]}</h3>
      ${renderBreakdown(counts, qid)}
    </div>`;
  }).join("");

  // Contact list
  const contactList = document.getElementById("contact-list");
  if(contacts.length === 0){
    contactList.innerHTML = '<div class="empty">Ingen kontakthenvendelser ennå</div>';
  } else {
    contactList.innerHTML = `<table>
      <thead><tr>
        <th>Tidspunkt</th><th>Navn</th><th>Firma</th><th>E-post</th><th>Type</th><th>Melding</th>
      </tr></thead>
      <tbody>${contacts.map(c => `
        <tr>
          <td>${formatDate(c.submittedAt)}</td>
          <td>${c.navn || "-"}</td>
          <td>${c.firma || "-"}</td>
          <td>${c.epost || "-"}</td>
          <td><span class="contact-tag">${c.type || "-"}</span></td>
          <td>${c.melding || "-"}</td>
        </tr>
      `).join("")}</tbody>
    </table>`;
  }

  // Survey list
  const surveyList = document.getElementById("survey-list");
  if(surveys.length === 0){
    surveyList.innerHTML = '<div class="empty">Ingen undersøkelsessvar ennå</div>';
  } else {
    surveyList.innerHTML = `<table>
      <thead><tr>
        <th>Tidspunkt</th><th>Navn</th><th>Kontakt</th><th>Rolle</th><th></th>
      </tr></thead>
      <tbody>${surveys.map((s, i) => {
        const answers = extractAnswers(s);
        return `
        <tr class="expandable" onclick="toggleDetail(${i})">
          <td>${formatDate(s.submittedAt)}</td>
          <td>${s.navn || "-"}</td>
          <td>${s.kontakt || "-"}</td>
          <td>${answers.q7 || "-"}</td>
          <td style="color:var(--muted); font-size:12px;">Vis svar ▾</td>
        </tr>
        <tr class="row-detail" id="detail-${i}" style="display:none;">
          <td colspan="5">
            ${QUESTION_ORDER.map(qid => `
              <div class="qline">
                <span class="qtext">${QUESTION_LABELS[qid]}</span>
                <span class="qans">${Array.isArray(answers[qid]) ? answers[qid].join(", ") : (answers[qid] || "—")}</span>
              </div>
            `).join("")}
          </td>
        </tr>`;
      }).join("")}</tbody>
    </table>`;
  }
};

window.toggleDetail = function(i){
  const el = document.getElementById("detail-"+i);
  el.style.display = el.style.display === "none" ? "table-row" : "none";
};
</script>

</body>
</html>
